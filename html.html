<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservasi Nutrisi HRD-GA</title>

    <!-- Konfigurasi agar bisa jadi Logo Aplikasi di HP -->
    <meta name="theme-color" content="#1B365D">
    <link rel="apple-touch-icon" href="https://portal.karirlink.id/company/pt-multi-indomandiri-wings-group">
    <link rel="icon" type="image/png" href="https://portal.karirlink.id/company/pt-multi-indomandiri-wings-group"> 

    <script src="https://portal.karirlink.id/company/pt-multi-indomandiri-wings-group"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-xl shadow-lg p-6">
        
        <!-- Bagian Logo & Judul -->
        <div class="text-center mb-6">
            <div class="flex justify-center mb-3">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpjjQ0KG8XLk69cJr3Es786wKiB3ug-v46kmbatp05O_-Lop7co52YEUvS&s=10" alt="Logo Aplikasi" class="w-16 h-16 object-contain rounded-full bg-slate-50 p-2 border border-slate-200 shadow-sm">
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Reservasi Nutrisi</h1>
            <p class="text-sm text-slate-500">HRD-GA</p>
        </div>

        <!-- Form Login (NIK & NAMA) -->
        <div id="loginSection">
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-1">NIK Karyawan</label>
                <input type="text" id="nikInput" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Contoh: 214006291">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Karyawan</label>
                <input type="text" id="namaInput" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Contoh: Budi Santoso">
            </div>
            <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition">MASUK</button>
        </div>

        <!-- Form Input Nutrisi (Hidden Default) -->
        <div id="formSection" class="hidden">
            <div class="bg-blue-50 p-3 rounded-lg mb-4 text-sm text-blue-800 flex justify-between items-center">
                <div>
                    <p class="font-semibold">Login: <span id="displayName" class="font-bold"></span></p>
                    <p class="text-xs text-blue-600">NIK: <span id="displayNik"></span></p>
                </div>
                <button onclick="handleLogout()" class="text-xs text-red-600 underline font-medium">Keluar</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Departemen</label>
                    <input type="text" id="departemenInput" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan Departemen">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Milku Btl 200Ml Cok Prem</label>
                    <input type="number" id="qtyCoklat" value="0" min="0" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Milku Btl 200Ml Strawberry</label>
                    <input type="number" id="qtyStraw" value="0" min="0" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Milku Btl 200Ml Original</label>
                    <input type="number" id="qtyOrig" value="0" min="0" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">AQUAVIVA</label>
                    <input type="number" id="qtyAqua" value="0" min="0" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <button onclick="submitData()" id="submitBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded-lg transition">KIRIM RESERVASI</button>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            const nik = document.getElementById('nikInput').value.trim();
            const nama = document.getElementById('namaInput').value.trim();

            if (!nik || !nama) {
                alert('Silakan masukkan NIK dan Nama terlebih dahulu!');
                return;
            }

            document.getElementById('displayNik').innerText = nik;
            document.getElementById('displayName').innerText = nama;

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('formSection').classList.remove('hidden');
        }

        function handleLogout() {
            document.getElementById('nikInput').value = '';
            document.getElementById('namaInput').value = '';
            document.getElementById('formSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        function submitData() {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Memproses...';

            const payload = {
                nik: document.getElementById('displayNik').innerText,
                nama: document.getElementById('displayName').innerText,
                departemen: document.getElementById('departemenInput').value,
                milkuCoklat: document.getElementById('qtyCoklat').value,
                milkuStraw: document.getElementById('qtyStraw').value,
                milkuOrig: document.getElementById('qtyOrig').value,
                aquaviva: document.getElementById('qtyAqua').value
            };

            // Masukkan URL Web App Google Apps Script Anda yang berakhiran /exec di bawah ini:
            const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwKs_m90pvZuFCHAz4N2otvZmuXvmCRUItD91qaJxRV3fKkyv_R9h1r1hgY5k6AJs8mqQ/exec';

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert('Data berhasil disimpan!');
                btn.disabled = false;
                btn.innerText = 'KIRIM RESERVASI';
                
                // Reset input item form
                document.getElementById('departemenInput').value = '';
                document.getElementById('qtyCoklat').value = '0';
                document.getElementById('qtyStraw').value = '0';
                document.getElementById('qtyOrig').value = '0';
                document.getElementById('qtyAqua').value = '0';
            })
            .catch((error) => {
                alert('Gagal menyimpan data: ' + error);
                btn.disabled = false;
                btn.innerText = 'KIRIM RESERVASI';
            });
        }
    </script>
</body>
</html>
