<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservasi Nutrisi HRD-GA</title>

    <!-- Konfigurasi agar bisa jadi Logo Aplikasi di HP -->
    <meta name="theme-color" content="#f472b6">
    <link rel="apple-touch-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpjjQ0KG8XLk69cJr3Es786wKiB3ug-v46kmbatp05O_-Lop7co52YEUvS&s=10">
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpjjQ0KG8XLk69cJr3Es786wKiB3ug-v46kmbatp05O_-Lop7co52YEUvS&s=10"> 

    <script src="https://portal.karirlink.id/company/pt-multi-indomandiri-wings-group"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Menggunakan font yang bersih dan kalem */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-rose-50/50 to-pink-100/60 min-h-screen flex flex-col items-center justify-center p-4">
    
    <!-- Kontainer Utama Form -->
    <div class="bg-white/90 backdrop-blur-md w-full max-w-md rounded-3xl shadow-xl p-8 border border-pink-100 mb-4">
        
        <!-- Bagian Logo & Judul -->
        <div class="text-center mb-7">
            <div class="flex justify-center mb-3">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpjjQ0KG8XLk69cJr3Es786wKiB3ug-v46kmbatp05O_-Lop7co52YEUvS&s=10" alt="Logo Aplikasi" class="w-16 h-16 object-contain rounded-2xl bg-pink-50 p-2.5 border border-pink-200/60 shadow-sm">
            </div>
            <h1 class="text-xl font-bold text-slate-800 tracking-normal">Reservasi Nutrisi</h1>
            <p class="text-xs font-medium text-pink-500 tracking-wider uppercase mt-1">HRD-GA Department</p>
        </div>

        <!-- Form Login (NIK & NAMA) -->
        <div id="loginSection" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1.5">NIK Karyawan</label>
                <input type="text" id="nikInput" maxlength="9" class="w-full px-4 py-3 bg-slate-50/70 border border-slate-200/80 rounded-2xl focus:ring-2 focus:ring-pink-400 focus:bg-white outline-none transition text-slate-700 text-sm placeholder-slate-400" placeholder="Contoh: 214006291">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1.5">Nama Karyawan</label>
                <input type="text" id="namaInput" class="w-full px-4 py-3 bg-slate-50/70 border border-slate-200/80 rounded-2xl focus:ring-2 focus:ring-pink-400 focus:bg-white outline-none transition text-slate-700 text-sm placeholder-slate-400" placeholder="Contoh: Budi Santoso">
            </div>
            <button onclick="handleLogin()" class="w-full mt-2 bg-pink-500 hover:bg-pink-600 active:scale-[0.98] text-white font-semibold text-sm py-3.5 rounded-2xl shadow-md shadow-pink-500/20 transition-all duration-200">
                Masuk
            </button>
        </div>

        <!-- Form Input Nutrisi (Hidden Default) -->
        <div id="formSection" class="hidden space-y-4">
            <div class="bg-pink-50/60 p-3.5 rounded-2xl border border-pink-100 flex justify-between items-center">
                <div>
                    <p class="text-[11px] text-pink-600 font-medium">Login sebagai:</p>
                    <p class="text-xs font-bold text-slate-800" id="displayName"></p>
                    <p class="text-[11px] text-slate-500 font-medium mt-0.5">NIK: <span id="displayNik"></span></p>
                </div>
                <button onclick="handleLogout()" class="text-xs font-semibold text-rose-500 bg-white px-3 py-1.5 rounded-xl border border-rose-100 hover:bg-rose-50 transition shadow-sm">
                    Keluar
                </button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Departemen</label>
                    <input type="text" id="departemenInput" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-pink-400 focus:bg-white outline-none transition text-slate-700 text-sm placeholder-slate-400" placeholder="Masukkan Departemen">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Milku Btl 200Ml Cok Prem</label>
                    <input type="number" id="qtyCoklat" value="0" min="0" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-pink-400 focus:bg-white outline-none transition text-slate-700 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Milku Btl 200Ml Strawberry</label>
                    <input type="number" id="qtyStraw" value="0" min="0" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-pink-400 focus:bg-white outline-none transition text-slate-700 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Milku Btl 200Ml Original</label>
                    <input type="number" id="qtyOrig" value="0" min="0" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-pink-400 focus:bg-white outline-none transition text-slate-700 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">AQUVIVA</label>
                    <input type="number" id="qtyAqua" value="0" min="0" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-pink-400 focus:bg-white outline-none transition text-slate-700 text-sm">
                </div>

                <button onclick="submitData()" id="submitBtn" class="w-full mt-2 bg-pink-500 hover:bg-pink-600 active:scale-[0.98] text-white font-semibold text-sm py-3.5 rounded-2xl shadow-md shadow-pink-500/20 transition-all duration-200">
                    Kirim Reservasi
                </button>
            </div>
        </div>
    </div>

    <!-- Footer di bawah kartu -->
    <footer class="text-center text-xs text-slate-500 font-medium">
        &copy; 2026 by HRD-GA Dept
    </footer>

    <script>
        function handleLogin() {
            const nik = document.getElementById('nikInput').value.trim();
            const nama = document.getElementById('namaInput').value.trim();

            if (!nik || !nama) {
                alert('Silakan masukkan NIK dan Nama terlebih dahulu!');
                return;
            }

            // Validasi NIK harus tepat 9 digit
            if (nik.length !== 9 || isNaN(nik)) {
                alert('NIK harus diisi lengkap sebanyak 9 digit angka!');
                return;
            }

            document.getElementById('displayNik').innerText = nik;
            document.getElementById('displayName').innerText = nama;

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('formSection').classList.remove('hidden');
        }

        function handleLogout() {
            document.getElementById('nikInput').value = '';
            document.getElementById('namaInput').value = '';
            document.getElementById('formSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        function submitData() {
            const departemen = document.getElementById('departemenInput').value.trim();

            // Validasi Departemen wajib diisi
            if (!departemen) {
                alert('Nama Departemen wajib diisi terlebih dahulu!');
                document.getElementById('departemenInput').focus();
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Memproses...';

            const payload = {
                nik: document.getElementById('displayNik').innerText,
                nama: document.getElementById('displayName').innerText,
                departemen: departemen,
                milkuCoklat: document.getElementById('qtyCoklat').value,
                milkuStraw: document.getElementById('qtyStraw').value,
                milkuOrig: document.getElementById('qtyOrig').value,
                aquviva: document.getElementById('qtyAqua').value
            };

            const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxB3oEHWG13F3iaYFmMhxd7QVL6aIBuuWLwHc9zZSwxenYNsL58K1PZoEATKQUvXvb7dw/exec';

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert('Data berhasil disimpan!');
                btn.disabled = false;
                btn.innerText = 'Kirim Reservasi';
                
                // Reset input item form
                document.getElementById('departemenInput').value = '';
                document.getElementById('qtyCoklat').value = '0';
                document.getElementById('qtyStraw').value = '0';
                document.getElementById('qtyOrig').value = '0';
                document.getElementById('qtyAqua').value = '0';
            })
            .catch((error) => {
                alert('Gagal menyimpan data: ' + error);
                btn.disabled = false;
                btn.innerText = 'Kirim Reservasi';
            });
        }
    </script>
</body>
</html>
