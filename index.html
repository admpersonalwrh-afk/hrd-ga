<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservasi Nutrisi HRD-GA</title>

    <!-- Konfigurasi agar bisa jadi Logo Aplikasi di HP -->
    <meta name="theme-color" content="#F9DAD9">
    <link rel="apple-touch-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpjjQ0KG8XLk69cJr3Es786wKiB3ug-v46kmbatp05O_-Lop7co52YEUvS&s=10">
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpjjQ0KG8XLk69cJr3Es786wKiB3ug-v46kmbatp05O_-Lop7co52YEUvS&s=10"> 

    <script src="https://portal.karirlink.id/company/pt-multi-indomandiri-wings-group"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Menggunakan font yang bersih dan kalem */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[#F9DAD9] via-rose-50/50 to-[#f5c7c5] min-h-screen flex flex-col items-center justify-center p-4">
    
    <!-- Kontainer Utama Form -->
    <div class="bg-white/90 backdrop-blur-md w-full max-w-md rounded-3xl shadow-xl p-8 border border-[#F9DAD9] mb-4">
        
        <!-- Bagian Logo & Judul -->
        <div class="text-center mb-7">
            <div class="flex justify-center mb-3">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpjjQ0KG8XLk69cJr3Es786wKiB3ug-v46kmbatp05O_-Lop7co52YEUvS&s=10" alt="Logo Aplikasi" class="w-16 h-16 object-contain rounded-2xl bg-[#F9DAD9]/30 p-2.5 border border-[#F9DAD9] shadow-sm">
            </div>
            <h1 class="text-xl font-bold text-slate-800 tracking-normal">Reservasi Nutrisi</h1>
            <p class="text-xs font-medium text-rose-500 tracking-wider uppercase mt-1">HRD-GA Department</p>
        </div>

        <!-- Form Login (NIK & NAMA) -->
        <div id="loginSection" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1.5">NIK Karyawan</label>
                <input type="text" id="nikInput" maxlength="9" class="w-full px-4 py-3 bg-slate-50/70 border border-slate-200/80 rounded-2xl focus:ring-2 focus:ring-[#F9DAD9] focus:bg-white outline-none transition text-slate-700 text-sm placeholder-slate-400" placeholder="Contoh: 214006291">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1.5">Nama Karyawan</label>
                <input type="text" id="namaInput" class="w-full px-4 py-3 bg-slate-50/70 border border-slate-200/80 rounded-2xl focus:ring-2 focus:ring-[#F9DAD9] focus:bg-white outline-none transition text-slate-700 text-sm placeholder-slate-400" placeholder="Contoh: Nauroh Hasniyah">
            </div>
            <button onclick="handleLogin()" class="w-full mt-2 bg-rose-400 hover:bg-rose-500 active:scale-[0.98] text-white font-semibold text-sm py-3.5 rounded-2xl shadow-md shadow-rose-400/20 transition-all duration-200">
                Masuk
            </button>
        </div>

        <!-- Form Input Nutrisi (Hidden Default) -->
        <div id="formSection" class="hidden space-y-4">
            <div class="bg-[#F9DAD9]/30 p-3.5 rounded-2xl border border-[#F9DAD9] flex justify-between items-center">
                <div>
                    <p class="text-[11px] text-rose-600 font-medium">Login sebagai:</p>
                    <p class="text-xs font-bold text-slate-800" id="displayName"></p>
                    <p class="text-[11px] text-slate-500 font-medium mt-0.5">NIK: <span id="displayNik"></span></p>
                </div>
                <button onclick="handleLogout()" class="text-xs font-semibold text-rose-500 bg-white px-3 py-1.5 rounded-xl border border-rose-100 hover:bg-rose-50 transition shadow-sm">
                    Keluar
                </button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Departemen</label>
                    <input type="text" id="departemenInput" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-[#F9DAD9] focus:bg-white outline-none transition text-slate-700 text-sm placeholder-slate-400" placeholder="Masukkan Departemen">
                </div>

                <!-- Tombol Pilihan Kategori (Tab Switcher) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">Pilih Kategori Produk</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" id="tabMilku" onclick="switchCategory('milku')" class="py-2.5 text-xs font-semibold rounded-xl border transition shadow-sm bg-rose-400 text-white border-rose-400">
                            Milku
                        </button>
                        <button type="button" id="tabAquviva" onclick="switchCategory('aquviva')" class="py-2.5 text-xs font-semibold rounded-xl border transition shadow-sm bg-slate-50 text-slate-600 border-slate-200/80">
                            AQUVIVA
                        </button>
                    </div>
                </div>

                <!-- Kontainer Input Milku -->
                <div id="sectionMilku" class="space-y-3 pt-1">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Milku Btl 200Ml Cok Prem</label>
                        <input type="number" id="qtyCoklat" value="0" min="0" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-[#F9DAD9] focus:bg-white outline-none transition text-slate-700 text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Milku Btl 200Ml Strawberry</label>
                        <input type="number" id="qtyStraw" value="0" min="0" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-[#F9DAD9] focus:bg-white outline-none transition text-slate-700 text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Milku Btl 200Ml Original</label>
                        <input type="number" id="qtyOrig" value="0" min="0" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-[#F9DAD9] focus:bg-white outline-none transition text-slate-700 text-sm">
                    </div>
                </div>

                <!-- Kontainer Input AQUVIVA (Hidden Default) - Terbagi 250ml & 700ml -->
                <div id="sectionAquviva" class="hidden space-y-3 pt-1">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">AQUVIVA 250ML</label>
                        <input type="number" id="qtyAqua250" value="0" min="0" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-[#F9DAD9] focus:bg-white outline-none transition text-slate-700 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">AQUVIVA 700ML</label>
                        <input type="number" id="qtyAqua700" value="0" min="0" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-[#F9DAD9] focus:bg-white outline-none transition text-slate-700 text-sm">
                    </div>
                </div>

                <button onclick="submitData()" id="submitBtn" class="w-full mt-2 bg-rose-400 hover:bg-rose-500 active:scale-[0.98] text-white font-semibold text-sm py-3.5 rounded-2xl shadow-md shadow-rose-400/20 transition-all duration-200">
                    Kirim Reservasi
                </button>
            </div>
        </div>

        <!-- Bagian Sukses / Konfirmasi (Hidden Default) -->
        <div id="successSection" class="hidden text-center space-y-4">
            <div class="flex justify-center">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center text-3xl shadow-sm border border-emerald-200 animate-bounce">
                    ✓
                </div>
            </div>
            <div>
                <h2 class="text-base font-bold text-slate-800">Reservasi Berhasil Dikirim!</h2>
                <p class="text-xs text-slate-500 mt-0.5">Berikut rincian jumlah reservasi nutrisi Anda:</p>
            </div>

            <!-- Ringkasan Jumlah Reservasi -->
            <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 text-left space-y-2 text-xs">
                <div class="flex justify-between pb-1.5 border-b border-slate-200/60">
                    <span class="text-slate-600 font-medium">Departemen:</span>
                    <span class="font-bold text-slate-800" id="resDept"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-600">Milku Cokelat Prem:</span>
                    <span class="font-bold text-slate-800" id="resCoklat">0</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-600">Milku Strawberry:</span>
                    <span class="font-bold text-slate-800" id="resStraw">0</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-600">Milku Original:</span>
                    <span class="font-bold text-slate-800" id="resOrig">0</span>
                </div>
                <div class="flex justify-between pt-1 border-t border-slate-200/60">
                    <span class="text-slate-600">AQUVIVA 250ML:</span>
                    <span class="font-bold text-rose-600" id="resAqua250">0</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-600">AQUVIVA 700ML:</span>
                    <span class="font-bold text-rose-600" id="resAqua700">0</span>
                </div>
            </div>

            <button onclick="resetToForm()" class="w-full bg-rose-400 hover:bg-rose-500 active:scale-[0.98] text-white font-semibold text-sm py-3.5 rounded-2xl shadow-md shadow-rose-400/20 transition-all duration-200">
                Buat Reservasi Baru
            </button>
        </div>

    </div>

    <!-- Footer di bawah kartu -->
    <footer class="text-center text-xs text-slate-500 font-medium">
        &copy; 2026 by HRD-GA Dept
    </footer>

    <script>
        function handleLogin() {
            const nik = document.getElementById('nikInput').value.trim();
            const nama = document.getElementById('namaInput').value.trim();

            if (!nik || !nama) {
                alert('Silakan masukkan NIK dan Nama terlebih dahulu!');
                return;
            }

            // Validasi NIK harus tepat 9 digit
            if (nik.length !== 9 || isNaN(nik)) {
                alert('NIK harus diisi lengkap sebanyak 9 digit angka!');
                return;
            }

            document.getElementById('displayNik').innerText = nik;
            document.getElementById('displayName').innerText = nama;

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('formSection').classList.remove('hidden');
        }

        function handleLogout() {
            document.getElementById('nikInput').value = '';
            document.getElementById('namaInput').value = '';
            document.getElementById('formSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        function switchCategory(category) {
            const tabMilku = document.getElementById('tabMilku');
            const tabAquviva = document.getElementById('tabAquviva');
            const secMilku = document.getElementById('sectionMilku');
            const secAquviva = document.getElementById('sectionAquviva');

            if (category === 'milku') {
                tabMilku.className = "py-2.5 text-xs font-semibold rounded-xl border transition shadow-sm bg-rose-400 text-white border-rose-400";
                tabAquviva.className = "py-2.5 text-xs font-semibold rounded-xl border transition shadow-sm bg-slate-50 text-slate-600 border-slate-200/80";
                secMilku.classList.remove('hidden');
                secAquviva.classList.add('hidden');
            } else {
                tabAquviva.className = "py-2.5 text-xs font-semibold rounded-xl border transition shadow-sm bg-rose-400 text-white border-rose-400";
                tabMilku.className = "py-2.5 text-xs font-semibold rounded-xl border transition shadow-sm bg-slate-50 text-slate-600 border-slate-200/80";
                secAquviva.classList.remove('hidden');
                secMilku.classList.add('hidden');
            }
        }

        function submitData() {
            const departemen = document.getElementById('departemenInput').value.trim();

            // Validasi Departemen wajib diisi
            if (!departemen) {
                alert('Nama Departemen wajib diisi terlebih dahulu!');
                document.getElementById('departemenInput').focus();
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Memproses...';

            // Ambil nilai Qty
            const coklat = document.getElementById('qtyCoklat').value || 0;
            const straw = document.getElementById('qtyStraw').value || 0;
            const orig = document.getElementById('qtyOrig').value || 0;
            const aqua250 = document.getElementById('qtyAqua250').value || 0;
            const aqua700 = document.getElementById('qtyAqua700').value || 0;

            const payload = {
                nik: document.getElementById('displayNik').innerText,
                nama: document.getElementById('displayName').innerText,
                departemen: departemen,
                milkuCoklat: coklat,
                milkuStraw: straw,
                milkuOrig: orig,
                aquviva250: aqua250,
                aquviva700: aqua700
            };

            const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyzwYc_EAQjy4cciUQr-DUgb4AQL8z-tBvqI_1w5wkfx6KGt9fB_5oD3-LfIzEvqUd7/exec';

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                btn.disabled = false;
                btn.innerText = 'Kirim Reservasi';
                
                // Masukkan data ke tampilan ringkasan sukses
                document.getElementById('resDept').innerText = departemen;
                document.getElementById('resCoklat').innerText = coklat;
                document.getElementById('resStraw').innerText = straw;
                document.getElementById('resOrig').innerText = orig;
                document.getElementById('resAqua250').innerText = aqua250;
                document.getElementById('resAqua700').innerText = aqua700;

                // Sembunyikan form, tampilkan bagian sukses
                document.getElementById('formSection').classList.add('hidden');
                document.getElementById('successSection').classList.remove('hidden');
            })
            .catch((error) => {
                alert('Gagal menyimpan data: ' + error);
                btn.disabled = false;
                btn.innerText = 'Kirim Reservasi';
            });
        }

        function resetToForm() {
            // Reset input form
            document.getElementById('departemenInput').value = '';
            document.getElementById('qtyCoklat').value = '0';
            document.getElementById('qtyStraw').value = '0';
            document.getElementById('qtyOrig').value = '0';
            document.getElementById('qtyAqua250').value = '0';
            document.getElementById('qtyAqua700').value = '0';
            switchCategory('milku'); // Kembali ke tab Milku

            // Sembunyikan sukses, tampilkan kembali form input
            document.getElementById('successSection').classList.add('hidden');
            document.getElementById('formSection').classList.remove('hidden');
        }
    </script>
</body>
</html>
