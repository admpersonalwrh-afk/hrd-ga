<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservasi Nutrisi HRD-GA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-8 border border-gray-100">
        <!-- Header / Logo Section -->
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-gray-800">Reservasi Nutrisi HRD-GA</h1>
            <p class="text-xs text-gray-500 mt-1">Warehouse 1 Finished Goods</p>
        </div>

        <!-- Form Login (NIK & NAMA) -->
        <div id="loginSection">
            <div class="mb-4">
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">NIK Karyawan</label>
                <input type="text" id="nikInput" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition text-sm" placeholder="Masukkan NIK Anda">
            </div>
            <div class="mb-6">
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">Nama Karyawan</label>
                <input type="text" id="namaInput" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition text-sm" placeholder="Masukkan Nama Lengkap">
            </div>
            <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition duration-200 text-sm">MASUK</button>
        </div>

        <!-- Form Input Nutrisi (Hidden Default) -->
        <div id="formSection" class="hidden">
            <div class="bg-blue-50 border border-blue-100 p-3 rounded-xl mb-5 flex justify-between items-center text-sm">
                <div>
                    <p class="font-bold text-blue-900"><span id="displayName"></span></p>
                    <p class="text-xs text-blue-700">NIK: <span id="displayNik"></span></p>
                </div>
                <button onclick="handleLogout()" class="text-xs text-red-600 hover:text-red-700 underline font-semibold">Keluar</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Departemen</label>
                    <input type="text" id="departemenInput" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition text-sm" placeholder="Masukkan Departemen">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Milku Btl 200Ml Cok Prem</label>
                    <input type="number" id="qtyCoklat" value="0" min="0" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Milku Btl 200Ml Strawberry</label>
                    <input type="number" id="qtyStraw" value="0" min="0" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Milku Btl 200Ml Original</label>
                    <input type="number" id="qtyOrig" value="0" min="0" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">AQUAVIVA</label>
                    <input type="number" id="qtyAqua" value="0" min="0" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition text-sm">
                </div>

                <button onclick="submitData()" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition duration-200 text-sm mt-2">KIRIM RESERVASI</button>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            const nik = document.getElementById('nikInput').value.trim();
            const nama = document.getElementById('namaInput').value.trim();

            if (!nik || !nama) {
                alert('Silakan masukkan NIK dan Nama terlebih dahulu!');
                return;
            }

            document.getElementById('displayNik').innerText = nik;
            document.getElementById('displayName').innerText = nama;

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('formSection').classList.remove('hidden');
        }

        function handleLogout() {
            document.getElementById('nikInput').value = '';
            document.getElementById('namaInput').value = '';
            document.getElementById('formSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }
